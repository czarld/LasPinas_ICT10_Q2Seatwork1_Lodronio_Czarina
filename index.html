
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Volleyball Varsity</title>


    <link rel="stylesheet" href="style.css">


    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>

    <header>
        <div class="reactor"></div>
        <h1>Volleyball Varsity</h1>
        <p>OBLP Girls Volleyball Varsity Team</p>
    </header>

    <main>
        <h2>Membership Checker</h2>
        <p>Enter your name to check if you are a member.</p>

        <form>
            <input
                type="text"
                id="first_name"
                placeholder="Enter your first name"
                required
            >

            <input
                type="text"
                id="last_name"
                placeholder="Enter your last name"
                required
            >

            <input
                type="button"
                py-click="candidate_checker"
                value="Enter"
            >
        </form>

        <div id="result"></div>
    </main>

    <py-script src="main.py"></py-script>

</body>
</html>
